name: C++ CI Build & Verification

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }} - ${{ matrix.cxx }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            cxx: g++
          - os: ubuntu-latest
            cxx: clang++
          - os: macos-latest
            cxx: clang++

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Compile Cinema Application
        run: |
          make clean
          make build CXX=${{ matrix.cxx }}

      - name: Run Test Suite & Edge-Case Verification
        run: |
          make test
